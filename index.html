<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><meta name="description" content="HYROX 8-Week Doubles Training Tracker"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><title>HYROX Doubles Tracker</title><style>
:root{--bg:#f6f7f9;--card:#fff;--text:#111827;--muted:#667085;--line:#e4e7ec;--accent:#111827;--accent2:#eef2ff;--ok:#067647;--danger:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}button,input,select,textarea{font:inherit}button{min-height:44px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 12px;font-weight:650;cursor:pointer}button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}button.active{background:var(--accent2);border-color:#aab4ff}.app{max-width:980px;margin:auto;padding:18px 14px 42px}.top{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}.title h1{font-size:25px;margin:0}.muted{color:var(--muted)}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;background:#fff;padding:10px;min-height:44px}.tabs{display:flex;gap:7px;overflow:auto;padding:2px 0 10px}.tabs button{white-space:nowrap}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;margin-top:12px}.sessionhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.sessionhead h2{margin:2px 0;font-size:21px}.badge{font-size:12px;padding:5px 8px;border-radius:999px;background:#f2f4f7}.section{margin-top:18px}.section h3{font-size:15px;margin:0 0 7px}.section ul{margin:0;padding-left:20px}.section li{margin:5px 0}.quote{color:var(--muted);font-style:italic;margin-top:7px}.coach{border-left:3px solid var(--line);padding-left:11px;color:#475467}.logger{margin-top:18px}.exercise{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px}.exercise h4{margin:0 0 5px}.target{font-size:13px;color:var(--muted)}table{width:100%;border-collapse:collapse;margin-top:9px}th,td{text-align:left;padding:7px 4px;border-bottom:1px solid var(--line);font-size:13px}td input{width:100%;min-width:54px;border:1px solid var(--line);border-radius:7px;padding:7px}td input[type=checkbox]{width:20px;height:20px}.progressbar{height:8px;background:#eaecf0;border-radius:999px;overflow:hidden;margin-top:7px}.progressbar i{display:block;height:100%;background:#111827;width:0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#f9fafb;border:1px solid var(--line);border-radius:10px;padding:10px}.stat strong{display:block;font-size:19px}.small{font-size:13px}.hidden{display:none}@media(max-width:620px){.controls{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.app{padding:13px 10px 35px}.sessionhead{flex-direction:column}}
</style></head><body><main class="app" id="app"><div class="top"><div class="title"><div class="muted small">8-week training tracker</div><h1>HYROX Doubles</h1></div><button id="install" class="primary hidden">Install app</button></div><div class="controls"><div class="field"><label>Programme start</label><input id="start" type="date" value="2026-10-12"></div><div class="field"><label>Week</label><select id="week"></select></div></div><div class="stats"><div class="stat"><span class="muted small">Sessions</span><strong id="doneCount">0 / 56</strong></div><div class="stat"><span class="muted small">Completion</span><strong id="pct">0%</strong></div><div class="stat"><span class="muted small">Selected date</span><strong id="dateLabel">—</strong></div></div><div class="progressbar"><i id="bar"></i></div><div class="tabs" id="days"></div><div id="content"></div></main><script src="data.js"></script><script>
(()=>{const app=document.getElementById('app');const data=window.HYROX_DATA;const weeks=data.weeks;const state=JSON.parse(localStorage.getItem('hyroxTrackerV1')||'{"done":{},"logs":{},"start":"2026-10-12"}');const $=id=>document.getElementById(id);$('start').value=state.start||'2026-10-12';let wi=0,di=0;
function key(){return 'w'+weeks[wi].week+'-'+weeks[wi].sessions[di].day}
function save(){localStorage.setItem('hyroxTrackerV1',JSON.stringify(state));renderStats()}
function dateFor(){const d=new Date(($('start').value||state.start)+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+wi*7+di);return d.toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short',year:'numeric',timeZone:'UTC'})}
function renderWeeks(){weeks.forEach((w,i)=>{let o=document.createElement('option');o.value=i;o.textContent='Week '+w.week;$('week').appendChild(o)});$('week').value=wi}
function renderDays(){const el=$('days');el.innerHTML='';weeks[wi].sessions.forEach((s,i)=>{const b=document.createElement('button');b.textContent=s.day.slice(0,3);b.className=i===di?'active':'';b.onclick=()=>{di=i;render()};el.appendChild(b)})}
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function lines(body){return body.split('\n').map(x=>x.trim()).filter(x=>x&&!/^HYROX 8-Week/i.test(x))}
function sectionize(body){const ls=lines(body);const sections=[];let cur={title:'Session details',items:[]};const heads=/^(Warm-?Up|Main Set.*|Working Set|Strength Block.*|Sled Intervals.*|Sled Power.*|Conditioning|Cool-Down|Speed Finisher.*|Finisher|Optional Machine Work|Machine Work|Hyrox EMOM.*|Coaching Tips|Scoring|Main Set.*|Round [1-9].*|Choose Your Option.*|Race Day|Race Mindset.*|Strength Work|Sled Drag|Anaerobic Threshold.*|HYROX-Specific.*)$/i;for(const l of ls){let x=l.replace(/^[-•]+\s*/,'');if(heads.test(x)&&!/^\d/.test(x)){if(cur.items.length)sections.push(cur);cur={title:x,items:[]}}else cur.items.push(x)}if(cur.items.length)sections.push(cur);return sections}
function parseExercises(body){const ls=lines(body),out=[];for(const l0 of ls){let l=l0.replace(/^[-•]+\s*/,'');if(/^(Back Squat|Dumbbell Bench Press|DB Bench Press|Walking Lunges|Barbell Bent Row|Sled (Push|Pull|Drag)|Deadlift|Seated Wall Balls|Wall Balls|Bodyweight Walking Lunges|Dumbbell\/Kettlebell Walking Lunges|Push-ups|Vertical Jumps|Heels Elevated Goblet Squat|Jumping Lunges)/i.test(l) && /(\d+\s*[x×]|\d+\s*×|\d+\s*reps|\d+\s*sets)/i.test(l)){let m=l.match(/^([^:–—]+?)(?::|\s+)[^0-9]*(\d+)\s*[x×]\s*(\d+)(.*)$/i);if(m){out.push({name:m[1].trim(),sets:+m[2],reps:m[3],target:m[4].trim()})}else{let m2=l.match(/^([^:–—]+?)(?::|\s+)(.*)$/);if(m2)out.push({name:m2[1].trim(),sets:1,reps:'',target:m2[2].trim()})}}}return out}
function renderStats(){const n=Object.values(state.done).filter(Boolean).length;const p=Math.round(n/56*100);$('doneCount').textContent=n+' / 56';$('pct').textContent=p+'%';$('bar').style.width=p+'%';$('dateLabel').textContent=dateFor()}
function render(){renderDays();renderStats();const s=weeks[wi].sessions[di],k=key(),log=state.logs[k]||{};let h='<div class="card"><div class="sessionhead"><div><div class="muted small">Week '+weeks[wi].week+' · '+s.day+' · '+dateFor()+'</div><h2>'+esc(s.name)+'</h2></div><label class="small"><input id="done" type="checkbox" '+(state.done[k]?'checked':'')+'> Completed</label></div>';for(const sec of sectionize(s.body)){h+='<div class="section"><h3>'+esc(sec.title)+'</h3>';let isCoach=/coaching tips/i.test(sec.title);if(isCoach){h+='<div class="coach">'+sec.items.map(x=>'<div>'+esc(x)+'</div>').join('')+'</div>'}else{h+='<ul>'+sec.items.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>'}h+='</div>'}const ex=parseExercises(s.body);if(ex.length){h+='<div class="logger"><h3>Exercise-by-exercise logging</h3><div class="muted small">Prescribed targets remain unchanged. Enter your actual result below.</div>';ex.forEach((e,ei)=>{h+='<div class="exercise"><h4>'+esc(e.name)+'</h4><div class="target">Prescribed: '+esc(String(e.sets))+' × '+esc(String(e.reps))+' '+esc(e.target)+'</div><table><thead><tr><th>Set</th><th>Weight</th><th>Reps</th><th>RPE</th><th>✓</th></tr></thead><tbody>';for(let n=0;n<e.sets;n++){const a=(log.ex||[])[ei]?.[n]||{};h+='<tr><td>'+(n+1)+'</td><td><input data-e="'+ei+'" data-s="'+n+'" data-f="weight" type="number" step="0.5" value="'+(a.weight??'')+'" placeholder="—"></td><td><input data-e="'+ei+'" data-s="'+n+'" data-f="reps" type="number" min="0" step="1" value="'+(a.reps??'')+'" placeholder="—"></td><td><input data-e="'+ei+'" data-s="'+n+'" data-f="rpe" type="number" min="1" max="10" step="1" value="'+(a.rpe??'')+'" placeholder="—"></td><td><input data-e="'+ei+'" data-s="'+n+'" data-f="done" type="checkbox" '+(a.done?'checked':'')+'></td></tr>'}h+='</tbody></table></div>'});h+='</div>'}h+='<div class="grid" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px"><div class="field"><label>Session RPE</label><input id="sessionRpe" type="number" min="1" max="10" value="'+(log.rpe??'')+'"></div><div class="field"><label>Session time</label><input id="time" type="text" value="'+esc(log.time||'')+'" placeholder="e.g. 52:30"></div></div><div class="field" style="margin-top:10px"><label>Notes</label><textarea id="notes" rows="3" placeholder="How did the session go?">'+esc(log.notes||'')+'</textarea></div><button id="save" class="primary" style="margin-top:10px;width:100%">Save session</button><div id="saved" class="muted small" style="margin-top:7px"></div></div>';$('content').innerHTML=h;$('done').onchange=e=>{state.done[k]=e.target.checked;save()};document.querySelectorAll('[data-e]').forEach(inp=>inp.addEventListener('change',()=>{const ei=+inp.dataset.e,si=+inp.dataset.s,field=inp.dataset.f;state.logs[k]??={};state.logs[k].ex??=[];state.logs[k].ex[ei]??=[];state.logs[k].ex[ei][si]??={};state.logs[k].ex[ei][si][field]=inp.type==='checkbox'?inp.checked:inp.value;save()}));$('save').onclick=()=>{state.logs[k]??={};state.logs[k].rpe=$('sessionRpe').value;state.logs[k].time=$('time').value;state.logs[k].notes=$('notes').value;save();$('saved').textContent='Saved on this device.'}}
$('week').onchange=e=>{wi=+e.target.value;di=0;render()};$('start').onchange=e=>{state.start=e.target.value;save();render()};renderWeeks();render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});let deferred;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;$('install').classList.remove('hidden')});$('install').onclick=async()=>{if(deferred){deferred.prompt();await deferred.userChoice;deferred=null;$('install').classList.add('hidden')}};
})();</script></body></html>
